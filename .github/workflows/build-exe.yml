name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  release:
    types: [created]

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r VidForgeAI/requirements.txt
          pip install pyinstaller

      - name: Stage bundled ffmpeg (unique name avoids PATH collisions)
        run: |
          choco install ffmpeg -y --no-progress
          $ff = (Get-Command ffmpeg.exe).Source
          New-Item -ItemType Directory -Force -Path VidForgeAI\bin | Out-Null
          Copy-Item $ff VidForgeAI\bin\vidforge_ffmpeg.exe
          & "C:\Program Files\ffmpeg\bin\ffprobe.exe" -version 2>$null | Out-Null
          if (Test-Path "C:\Program Files\ffmpeg\bin\ffprobe.exe") { Copy-Item "C:\Program Files\ffmpeg\bin\ffprobe.exe" VidForgeAI\bin\vidforge_ffprobe.exe }

      - name: Build .exe with PyInstaller
        run: pyinstaller --onefile --name VidForgeAI --windowed --collect-all edge_tts --collect-all pyttsx3 --add-data "VidForgeAI/bin;bin" --exclude-module playwright VidForgeAI/vidforge.py

      - name: Smoke test
        run: .\dist\VidForgeAI.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: VidForgeAI-windows-exe
          path: dist/VidForgeAI.exe
