name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  release:
    types: [created]

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r VidForgeAI/requirements.txt
          pip install pyinstaller

      - name: Stage bundled ffmpeg (unique name avoids PATH collisions)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path VidForgeAI\bin | Out-Null

          # 1) Try Chocolatey ffmpeg
          choco install ffmpeg -y --no-progress

          # 2) Auto-detect ffprobe/ffmpeg from known locations + PATH (choco v2.x
          #    installs to C:\ProgramData\chocolatey\lib\ffmpeg\tools, NOT
          #    C:\Program Files\ffmpeg — the old hardcoded path caused the build failure)
          $candidates = @(
            "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg-*\bin",
            "C:\ProgramData\chocolatey\lib\ffmpeg\tools\bin",
            "C:\Program Files\ffmpeg\bin"
          )
          function Find-Bin($name) {
            foreach ($d in $candidates) {
              $p = Join-Path $d $name
              $hit = Get-ChildItem -Path $p -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hit) { return $hit.FullName }
            }
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            return $null
          }

          $ff     = Find-Bin "ffmpeg.exe"
          $ffprobe = Find-Bin "ffprobe.exe"

          if (-not $ff) {
            Write-Host "::warning::System ffmpeg not found; using imageio-ffmpeg bundled binary as fallback"
            python -m pip install imageio-ffmpeg
            python -c "import imageio_ffmpeg,shutil; shutil.copy(imageio_ffmpeg.get_ffmpeg_exe(), r'VidForgeAI\bin\vidforge_ffmpeg.exe')"
          } else {
            Copy-Item $ff VidForgeAI\bin\vidforge_ffmpeg.exe
          }
          if ($ffprobe) {
            Copy-Item $ffprobe VidForgeAI\bin\vidforge_ffprobe.exe
          } else {
            Write-Host "::warning::ffprobe not found; app will fall back to ffmpeg-based probing at runtime"
          }

          # 3) Verify staged binaries
          Get-ChildItem VidForgeAI\bin
          .\VidForgeAI\bin\vidforge_ffmpeg.exe -version | Select-Object -First 1

      - name: Build .exe with PyInstaller
        run: pyinstaller --onefile --name VidForgeAI --windowed --collect-all edge_tts --collect-all pyttsx3 --add-data "VidForgeAI/bin;bin" --exclude-module playwright VidForgeAI/vidforge.py

      - name: Smoke test
        run: .\dist\VidForgeAI.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: VidForgeAI-windows-exe
          path: dist/VidForgeAI.exe
